services:
  app:
    container_name: bprime
    build: .
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/bprime.db
      STATIC_DIR: /app/web
      CORS_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
